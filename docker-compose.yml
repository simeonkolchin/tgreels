services:
  # ── API: раздаёт ленту, стримит видео/фото, индексирует, авторизация ──
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # БД + ключ шифрования + сессия переживают пересборку контейнера
      - ./backend/data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  # ── Frontend: nginx + reverse-proxy на backend ──────────
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5080:80"
    restart: unless-stopped
