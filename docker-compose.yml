services:
  # ── API: раздаёт ленту и стримит видео ──────────────────
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # своя стрим-сессия (нельзя шарить .session с воркером)
      SESSION_PATH: /app/data/session/userbot
      PYTHONUNBUFFERED: "1"
    volumes:
      # сессии Telegram + sqlite переживают пересборку контейнера
      - ./backend/data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  # ── Worker: парсер, крутится независимо, пишет в ту же БД ─
  worker:
    build: ./backend
    command: python scripts/worker.py
    env_file: ./backend/.env
    environment:
      # своя сессия воркера
      SESSION_PATH: /app/data/session/worker
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  # ── Frontend: nginx + reverse-proxy на backend ──────────
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5080:80"
    restart: unless-stopped
