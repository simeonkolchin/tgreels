server {
    listen 80;
    server_name _;

    # Docker DNS: резолвим backend в рантайме, а не один раз при старте —
    # иначе после пересоздания backend (смена IP) ловим 502 до перезапуска nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: всё неизвестное отдаём на index.html
    location / {
        try_files $uri /index.html;
    }

    # реиндекс может идти долго — без таймаута
    location = /api/reindex {
        proxy_pass $backend;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API и превью
    location /api     { proxy_pass $backend; }
    location /thumb   { proxy_pass $backend; }
    location /channel { proxy_pass $backend; }
    location /photo   { proxy_pass $backend; }
    location /health  { proxy_pass $backend; }

    # Стриминг видео: без буферизации, с поддержкой Range и долгих соединений
    location /stream {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
